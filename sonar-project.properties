# Sonar Project Configuration
sonar.projectKey=tech-blog
sonar.projectName=Tech Blog
sonar.projectVersion=1.0.0

# Point to your local SonarQube instance
sonar.host.url=http://localhost:9000

# Tell SonarQube to scan the frontend, backend, and infrastructure directories
sonar.sources=backend,infrastructure

sonar.tests=backend/tests

# Code coverage
sonar.coverage.exclusions=**/test/**,**/tests/**

# Exclude test files from the main code analysis
sonar.exclusions=**/tests/**,**/*.test.js,**/*.spec.js