name: Deploy Python CDK Stack
on:
  workflow_run:
    workflows: ['Ruff Lint & Format'] # Listens for the lint workflow to finish
    types:
      - completed
    branches:
      - main # Only listens if the lint workflow was triggered on the main branch

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    # CRITICAL GATEKEEPER: This ensures it only deploys if the linter actually PASSED.
    # Without this, it would deploy even if the linter failed!
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install Dependencies
        run: |
          # Install CDK CLI via NPM (standard even for Python CDK)
          npm install -g aws-cdk

          # Install Infrastructure deps
          cd infrastructure
          python -m pip install -r requirements.txt

          # Optional: Install Backend deps if you run tests here
          cd ../backend && python build.py

      - name: CDK Deploy
        run: |
          cd infrastructure
          cdk deploy --all --require-approval never
