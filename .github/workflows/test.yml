name: Backend unit tests

on:
  push:
    branches:
      - "**"
    paths:
      - "backend/**"
      - "infrastructure/requirements-dev.txt"
      - ".github/workflows/test.yml"

jobs:
  unit-tests:
    name: Pytest (backend)
    runs-on: ubuntu-latest
    # Handler modules instantiate boto3 DynamoDB at import time; CI has no ~/.aws config.
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r infrastructure/requirements-dev.txt

      - name: Run unit tests
        run: PYTHONPATH=backend python -m pytest backend/tests -v
