name: CI/CD Pipeline

# Flow:
#   PR / push (any branch): lint + test + cdk synth (dev + prod configs)
#   Push (any branch):      deploy (APP_ENV=dev — matches existing CloudFormation stacks)
#                             → Postman smoke + performance (Newman) after deploy
#   workflow_dispatch:      manual dev or prod deploy (both use APP_ENV=dev for now)
#
# Postman in deploy jobs needs GitHub environment secrets (admin Cognito user):
#   POSTMAN_USERNAME, POSTMAN_PASSWORD
# Optional: POSTMAN_DISPOSABLE_USER_ID for DELETE /users perf step
#
# NOTE: APP_ENV=prod cannot deploy into the existing TechBlogDataStack yet — it would try
# to rename DynamoDB tables (dev → prod) and roll back. Real prod needs env-suffixed stacks
# and resource names in a separate AWS account.
#
# GitHub setup: Settings → Environments → create "development" and "production"
#   Add secret AWS_ROLE_ARN in each (use different IAM roles / accounts for prod).
#   On "production": enable Required reviewers (and optional wait timer).

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      target:
        description: Manual deploy target
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
      postman_perf_iterations:
        description: Newman performance iterations after deploy (0 = smoke only)
        required: false
        default: "10"
        type: string

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements-dev.txt

      - name: Install Ruff
        run: pip install -r infrastructure/requirements-dev.txt

      - name: Ruff check
        run: ruff check --output-format=github backend/

      - name: Ruff format check
        run: ruff format --check backend/

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r infrastructure/requirements-dev.txt

      - name: Pytest
        run: PYTHONPATH=backend python -m pytest backend/tests -v

  synth:
    name: CDK synth (${{ matrix.app_env }})
    needs:
      - lint
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app_env:
          - dev
          - prod
    env:
      APP_ENV: ${{ matrix.app_env }}
      AWS_DEFAULT_REGION: us-east-1
      CDK_DEFAULT_ACCOUNT: "111111111111"
      CDK_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements.txt

      - name: Install CDK dependencies
        run: python -m pip install -r infrastructure/requirements.txt

      - name: Build Lambda layer bundle (Cython)
        env:
          CYTHONIZE: "1"
        run: |
          python -m pip install -r backend/requirements-build.txt
          python backend/build.py

      - name: CDK synth
        working-directory: infrastructure
        run: npx --yes aws-cdk@2.114.1 synth --quiet

  deploy-dev:
    name: Deploy → development
    needs:
      - lint
      - test
      - synth
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: development
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      APP_ENV: dev
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install CDK dependencies
        run: python -m pip install -r infrastructure/requirements.txt

      - name: Build Lambda layer bundle (Cython)
        env:
          CYTHONIZE: "1"
        run: |
          python -m pip install -r backend/requirements-build.txt
          python backend/build.py

      - name: Build frontend
        run: |
          cd ui
          npm ci
          npm run build

      - name: CDK deploy (development)
        run: bash scripts/cdk-deploy-ordered.sh

      - name: Print stack events on failure
        if: failure()
        run: |
          echo "=== SharedLayer export / import status ==="
          EXPORT=$(aws cloudformation list-exports \
            --query "Exports[?starts_with(Name, 'TechBlogLambdaStack:') && contains(Name, 'SharedLayer')].Name | [0]" \
            --output text 2>/dev/null || echo "None")
          echo "Export: ${EXPORT}"
          if [[ -n "${EXPORT}" && "${EXPORT}" != "None" ]]; then
            aws cloudformation list-imports --export-name "${EXPORT}" --output table || true
          fi
          for stack in TechBlogLambdaStack TechBlogApiStack TechBlogWarmerStack; do
            echo "=== Failed events for $stack ==="
            aws cloudformation describe-stack-events \
              --stack-name "$stack" \
              --query "StackEvents[?ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='CREATE_FAILED'].[LogicalResourceId,ResourceStatusReason]" \
              --output table 2>/dev/null || echo "(stack missing or no failed events)"
            echo "=== Last 15 events for $stack ==="
            aws cloudformation describe-stack-events \
              --stack-name "$stack" \
              --max-items 15 \
              --query "StackEvents[].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table 2>/dev/null || echo "(stack missing)"
          done

      - name: Upload frontend to S3
        run: bash scripts/deploy-frontend.sh

      - name: Smoke test API (development)
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name TechBlogApiStack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          test -n "$API_URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}posts")
          if [[ "$HTTP_CODE" != "401" && "$HTTP_CODE" != "403" ]]; then
            echo "Expected 401/403 from protected route, got $HTTP_CODE"
            exit 1
          fi

      - name: Postman API smoke & performance
        env:
          POSTMAN_USERNAME: ${{ secrets.POSTMAN_USERNAME }}
          POSTMAN_PASSWORD: ${{ secrets.POSTMAN_PASSWORD }}
          POSTMAN_DISPOSABLE_USER_ID: ${{ secrets.POSTMAN_DISPOSABLE_USER_ID }}
          RESOLVE_API_URL_FROM_AWS: "1"
          MAX_RESPONSE_MS: "8000"
          PERF_ITERATIONS: ${{ github.event.inputs.postman_perf_iterations || '10' }}
        run: bash scripts/postman-ci.sh pipeline

      - name: Upload Postman performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-perf-dev-${{ github.run_id }}
          path: postman/reports/perf-*.json
          if-no-files-found: ignore

      - name: Smoke test frontend
        run: |
          FRONTEND_URL=$(aws cloudformation describe-stacks \
            --stack-name TechBlogFrontendStack \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendUrl'].OutputValue" \
            --output text)
          test -n "$FRONTEND_URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Expected 200 from CloudFront, got $HTTP_CODE"
            exit 1
          fi

  deploy-prod:
    name: Deploy → production
    needs:
      - lint
      - test
      - synth
    if: |
      github.event_name == 'push' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'prod')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    concurrency:
      group: deploy-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      # Existing stacks/tables use dev names (tech-blog-dev-*). APP_ENV=prod breaks Data stack updates.
      APP_ENV: dev
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install CDK dependencies
        run: python -m pip install -r infrastructure/requirements.txt

      - name: Build Lambda layer bundle (Cython)
        env:
          CYTHONIZE: "1"
        run: |
          python -m pip install -r backend/requirements-build.txt
          python backend/build.py

      - name: Build frontend
        run: |
          cd ui
          npm ci
          npm run build

      - name: CDK deploy
        run: bash scripts/cdk-deploy-ordered.sh

      - name: Print stack events on failure
        if: failure()
        run: |
          echo "=== SharedLayer export / import status ==="
          EXPORT=$(aws cloudformation list-exports \
            --query "Exports[?starts_with(Name, 'TechBlogLambdaStack:') && contains(Name, 'SharedLayer')].Name | [0]" \
            --output text 2>/dev/null || echo "None")
          echo "Export: ${EXPORT}"
          if [[ -n "${EXPORT}" && "${EXPORT}" != "None" ]]; then
            aws cloudformation list-imports --export-name "${EXPORT}" --output table || true
          fi
          for stack in TechBlogLambdaStack TechBlogApiStack TechBlogWarmerStack; do
            echo "=== Failed events for $stack ==="
            aws cloudformation describe-stack-events \
              --stack-name "$stack" \
              --query "StackEvents[?ResourceStatus=='UPDATE_FAILED' || ResourceStatus=='CREATE_FAILED'].[LogicalResourceId,ResourceStatusReason]" \
              --output table 2>/dev/null || echo "(stack missing or no failed events)"
            echo "=== Last 15 events for $stack ==="
            aws cloudformation describe-stack-events \
              --stack-name "$stack" \
              --max-items 15 \
              --query "StackEvents[].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table 2>/dev/null || echo "(stack missing)"
          done

      - name: Upload frontend to S3
        run: bash scripts/deploy-frontend.sh

      - name: Smoke test API
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --stack-name TechBlogApiStack \
            --query "Stacks[0].Outputs[?OutputKey=='ApiUrl'].OutputValue" \
            --output text)
          test -n "$API_URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${API_URL}posts")
          if [[ "$HTTP_CODE" != "401" && "$HTTP_CODE" != "403" ]]; then
            echo "Expected 401/403 from protected route, got $HTTP_CODE"
            exit 1
          fi

      - name: Postman API smoke & performance
        env:
          POSTMAN_USERNAME: ${{ secrets.POSTMAN_USERNAME }}
          POSTMAN_PASSWORD: ${{ secrets.POSTMAN_PASSWORD }}
          POSTMAN_DISPOSABLE_USER_ID: ${{ secrets.POSTMAN_DISPOSABLE_USER_ID }}
          RESOLVE_API_URL_FROM_AWS: "1"
          MAX_RESPONSE_MS: "8000"
          PERF_ITERATIONS: ${{ github.event.inputs.postman_perf_iterations || '10' }}
        run: bash scripts/postman-ci.sh pipeline

      - name: Upload Postman performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-perf-prod-${{ github.run_id }}
          path: postman/reports/perf-*.json
          if-no-files-found: ignore

      - name: Smoke test frontend
        run: |
          FRONTEND_URL=$(aws cloudformation describe-stacks \
            --stack-name TechBlogFrontendStack \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendUrl'].OutputValue" \
            --output text)
          test -n "$FRONTEND_URL"
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$FRONTEND_URL")
          if [[ "$HTTP_CODE" != "200" ]]; then
            echo "Expected 200 from CloudFront, got $HTTP_CODE"
            exit 1
          fi
