name: CI/CD Pipeline

# Lint → test → deploy (main only) in one workflow.
# Requires GitHub secret: AWS_ROLE_ARN (OIDC trust to your AWS account).

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check --output-format=github backend/

      - name: Ruff format check
        run: ruff format --check backend/

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements-dev.txt

      - name: Install test dependencies
        run: pip install -r infrastructure/requirements-dev.txt

      - name: Pytest
        run: PYTHONPATH=backend python -m pytest backend/tests -v

  deploy:
    name: Deploy to AWS (CDK)
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
    if: github.event_name == 'push'
    env:
      AWS_DEFAULT_REGION: us-east-1
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: infrastructure/requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: Install infrastructure dependencies
        run: pip install -r infrastructure/requirements.txt

      - name: Build Lambda layer bundle
        run: python backend/build.py

      - name: CDK deploy all stacks
        working-directory: infrastructure
        run: cdk deploy --all --require-approval never
